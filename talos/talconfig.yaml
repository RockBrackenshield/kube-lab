---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://192.168.7.16:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "192.168.7.16"
  - "kube.hermnet.org"
additionalMachineCertSans: *sans

clusterPodNets: ["10.42.0.0/16"]
clusterSvcNets: ["10.43.0.0/16"]

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "kubecontrolpi"
    ipAddress: "192.168.7.15"
    installDiskSelector:
      serial: "mmcblk0"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/a636242df247ad4aad2e36d1026d8d4727b716a3061749bd7b19651e548f65e4
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "88:a2:9e:08:69:0f"
        dhcp: false
        addresses:
          - "192.168.7.15/24"
        routes:
          - gateway: "192.168.7.1"
            network: 0.0.0.0/0
        mtu: 1500
        vip:
          ip: "192.168.7.16"

# Global patches
patches:
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"
  - "@./patches/global/machine-time.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/cluster.yaml"

